# Dedicated origin recommended. Add real TLS certificates and upstream addresses.
# No sub2api authentication endpoint is assumed. Never inject tokens in URLs.
server {
    listen 443 ssl;
    server_name swe.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://swe-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # No credential-bearing query string logging.
        access_log off;
    }
}
