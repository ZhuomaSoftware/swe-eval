  worker:
    image: sha256:24399f7dc25ee551268b8719d9c6fe0db55e98236fe27e95b4b259bdcad4fe7a
    environment:
      SWE_TASK_DIR: /app/config/tasks
      MSWEA_GLOBAL_CONFIG_DIR: /tmp/swe-eval-mini-config
