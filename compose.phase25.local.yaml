    image: sha256:5528430648493b11472df93096a1c250a1e22a742bb86fc410acdfbf0655b237
    environment:
      SWE_TASK_DIR: /app/config/tasks
    volumes:
      - ${SWE_MODELS_FILE:-./models.local.json}:/app/config/models.json:ro
